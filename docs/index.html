<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pixel Morphogenesis</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>Pixel Morphogenesis</h1>
  <p class="subtitle">self-organizing pixels that grow and regenerate</p>

  </footer>

  <script src="nca.js"></script>
  <script src="app.js"></script>

</html>
